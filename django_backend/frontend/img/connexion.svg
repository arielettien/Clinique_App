<?xml version="1.0" encoding="UTF-8"?>
<!--
  Illustration du panneau de gauche de la page de connexion.

  POUR LA REMPLACER : depose ton image a cet emplacement exact
  (frontend/img/connexion.svg), ou change le src de la balise img dans
  login.html. Aucune autre modification n'est necessaire : l'image est
  affichee en object-fit cover, donc n'importe quel format et n'importe
  quelles proportions fonctionnent, le cadrage s'adapte.

  Les couleurs reprennent les jetons du theme blanc/bleu (primary #1D4ED8,
  primary-soft #EFF4FF). Un fichier SVG ne peut pas lire les variables CSS de
  la page : elles sont donc ecrites ici en dur, et ce sont les seules valeurs
  a reporter si la charte change.

  Attention : ce commentaire ne doit contenir aucune suite de deux tirets,
  interdite par XML. Ecrire les noms de variables CSS avec leur prefixe y
  rendait le fichier invalide, et l'image ne s'affichait pas du tout.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900"
     width="720" height="900" role="img" aria-label="">
  <rect width="720" height="900" fill="#EFF4FF"/>

  <!-- Agrandissement du dessin a l'interieur de sa zone, autour du centre
       (360, 450). Le fond ci-dessus n'est PAS inclus : il doit rester plein
       cadre. Ce facteur est le moyen le plus simple de regler la taille
       apparente de l'illustration. Deux seuils, mesures sur ce dessin :
         - au-dela de 1,20 le grand cercle exterieur depasse du cadre. Sans
           consequence : c'est l'element le plus pale (opacite 0,14), et le
           voir filer hors du cadre passe pour un parti pris.
         - au-dela de 1,52 c'est la carte blanche centrale qui touche le
           bord. La, ca se voit : ne pas depasser. -->
  <g transform="translate(360,450) scale(1.32) translate(-360,-450)">

  <!-- Cercles concentriques : donnent de la profondeur sans dégradé ni ombre,
       conformément au parti pris « plat » du thème. -->
  <g fill="none" stroke="#1D4ED8" stroke-width="2">
    <circle cx="360" cy="450" r="300" opacity="0.14"/>
    <circle cx="360" cy="450" r="236" opacity="0.18"/>
    <circle cx="360" cy="450" r="172" opacity="0.10"/>
  </g>

  <!-- Formes libres, très discrètes : elles meublent les angles sans attirer
       l'œil, qui doit rester sur le formulaire. -->
  <rect x="132" y="168" width="58" height="58" rx="18" fill="#1D4ED8" opacity="0.12"/>
  <rect x="546" y="624" width="74" height="74" rx="22" fill="#1D4ED8" opacity="0.09"/>
  <circle cx="556" cy="214" r="32" fill="none" stroke="#1D4ED8" stroke-width="6" opacity="0.20"/>
  <circle cx="168" cy="706" r="14" fill="#1D4ED8" opacity="0.18"/>
  <g fill="#1D4ED8" opacity="0.13">
    <rect x="604" y="416" width="14" height="48" rx="7"/>
    <rect x="587" y="433" width="48" height="14" rx="7"/>
  </g>

  <!-- Carte centrale et tracé cardiaque : le seul élément franc de l'image. -->
  <rect x="124" y="352" width="472" height="196" rx="26" fill="#FFFFFF"/>
  <rect x="124" y="352" width="472" height="196" rx="26" fill="none"
        stroke="#1D4ED8" stroke-width="2" opacity="0.16"/>
  <polyline points="162,450 232,450 259,408 288,492 316,370 347,450 402,450 428,424 453,472 482,450 558,450"
            fill="none" stroke="#1D4ED8" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="316" cy="370" r="10" fill="#1E40AF"/>
  </g>
</svg>
